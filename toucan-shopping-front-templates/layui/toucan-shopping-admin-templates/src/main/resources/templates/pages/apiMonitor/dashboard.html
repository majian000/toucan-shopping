<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>商城后台</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" th:href="@{/lib/layui-v2.9.13/src/css/layui.css}" media="all">
    <link rel="stylesheet" th:href="@{/css/public.css}" media="all">
</head>
<body>

<span th:replace="~{common_page::common}"></span>

<div class="layuimini-container">
    <div class="layuimini-main">

        <fieldset class="table-search-fieldset">
            <legend>搜索信息</legend>
            <div style="margin: 10px 10px 10px 10px">
                <form class="layui-form layui-form-pane" id="searchForm" action="">
                    <div class="layui-form-item">
                        <div class="layui-inline">
                            <label class="layui-form-label">接口URL</label>
                            <div class="layui-input-inline">
                                <input type="text" id="apiUrl" name="apiUrl" placeholder="" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">应用</label>
                            <div class="layui-input-inline">
                                <input type="text" name="appName" placeholder="" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">开始时间</label>
                            <div class="layui-input-inline">
                                <input type="text" id="startTime" name="startTime" placeholder="" class="layui-input" readonly>
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">结束时间</label>
                            <div class="layui-input-inline">
                                <input type="text" id="endTime" name="endTime" placeholder="" class="layui-input" readonly>
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">耗时 ≥ (ms)</label>
                            <div class="layui-input-inline">
                                <input type="text" id="minElapsed" name="minElapsed" placeholder="不填查全部" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <button type="submit" class="layui-btn layui-btn-primary" lay-submit lay-filter="data-search-btn"><i class="layui-icon">&#xe615;</i> 搜索</button>
                        </div>
                    </div>
                </form>
            </div>
        </fieldset>

        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <span th:each="tb : ${toolbarButtons}" th:utext="${tb}"></span>
            </div>
        </script>

        <table class="layui-hide" id="dashboardTable" lay-filter="dashboardTable"></table>


        <script type="text/html" id="dashboardTableBar">
            <span th:each="btn : ${rowButtons}" th:utext="${btn}"></span>
        </script>


    </div>
</div>
<script th:src="@{/lib/layui-v2.9.13/src/layui.js}" charset="utf-8"></script>
<script th:src="@{/lib/jquery-3.4.1/jquery-3.4.1.min.js}" charset="utf-8"></script>
<script>
    layui.use(['form', 'table', 'laydate'], function () {
        var laydate = layui.laydate;
        laydate.render({ elem: '#startTime', type: 'datetime', format: 'yyyy-MM-dd HH:mm:ss' });
        laydate.render({ elem: '#endTime',   type: 'datetime', format: 'yyyy-MM-dd HH:mm:ss' });

        var $ = layui.jquery,
            form = layui.form,
            table = layui.table;

        table.render({
            elem: '#dashboardTable',
            url: '',
            data: [],
            toolbar: '#toolbarDemo',
            defaultToolbar: ['filter', {
                title: '提示',
                layEvent: 'LAYTABLE_TIPS',
                icon: 'layui-icon-tips'
            }],
            parseData: function(res) {
                if (res.code === 1 && res.data) {
                    return { code: 0, data: res.data.list || [], count: res.data.total || 0 };
                }
                layer.msg(res.msg || '请求失败', { icon: 5 });
                return { code: -1, data: [], count: 0 };
            },
            cols: [
                [
                    {field: 'apiUrl', title: '接口URL', minWidth: 300},
                    {field: 'appName', title: '应用', width: 180},
                    {field: 'requestCount', title: '请求数(QPS)', width: 120, sort: true},
                    {field: 'avgMs', title: '平均耗时(ms)', width: 140, sort: true},
                    {field: 'maxMs', title: '最大耗时(ms)', width: 140, sort: true,
                        templet: function(d) {
                            if (d.maxMs > 1000) {
                                return '<span style="color:red;font-weight:bold">' + d.maxMs + '</span>';
                            }
                            return d.maxMs;
                        }},
                    {field: 'minMs', title: '最小耗时(ms)', width: 140},
                    {title: '操作', width: 100, align: 'center',templet: '#dashboardTableBar'}
                ]
            ],
            page: true,
            limits: [15, 30, 50, 100],
            limit: 30,
            skin: 'line'
        });



        // 监听行工具事件
        table.on('tool(dashboardTable)', function (obj) {
            var data = obj.data;
            if (obj.event === 'requestLog') {
                var index = layer.open({
                    title: '查看请求趋势 - ' + data.apiUrl,
                    type: 2,
                    shade: 0.2,
                    maxmin: true,
                    area: ['100%', '100%'],
                    content: '[[@{/}]]apiMonitor/dashboardRequestLogPage?apiUrl='
                        + encodeURIComponent(data.apiUrl) + '&appName=' + (data.appName || '')
                        + '&startTime=' + encodeURIComponent($('#startTime').val() || '')
                        + '&endTime=' + encodeURIComponent($('#endTime').val() || '')
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
            }
        });

        // 监听搜索操作
        form.on('submit(data-search-btn)', function (data) {
            if (!data.field.startTime || !data.field.endTime) {
                layer.msg('请选择时间范围', { icon: 5 });
                return false;
            }
            table.reload('dashboardTable', {
                url: "[[@{/}]]apiMonitor/summary",
                page: { curr: 1 },
                where: {
                    apiUrl: data.field.apiUrl || '',
                    appName: data.field.appName || '',
                    startTime: data.field.startTime,
                    endTime: data.field.endTime,
                    minElapsed: data.field.minElapsed || ''
                }
            });
            return false;
        });

        // 自动刷新
        var autoRefresh = false;

    });
</script>

</body>
</html>
