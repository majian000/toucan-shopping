<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>登录历史</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" th:href="@{/lib/layui-v2.5.5/css/layui.css}" media="all">
    <link rel="stylesheet" th:href="@{/css/public.css}" media="all">
</head>
<body>

<div class="layuimini-container">
    <div class="layuimini-main">

        <fieldset class="table-search-fieldset">
            <legend>搜索信息</legend>
            <div style="margin: 10px 10px 10px 10px">
                <form class="layui-form layui-form-pane" id="searchForm" action="">
                    <div class="layui-form-item">
                        <div class="layui-inline">
                            <label class="layui-form-label">所属应用</label>
                            <div class="layui-input-inline">
                                <select id="selectApp" name="appCode" lay-search="">
                                    <option value="">请选择</option>
                                    <option th:each="aa : ${apps}" th:value="${aa.code}" th:text="${aa.code}+' '+${aa.name}">
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">账号</label>
                            <div class="layui-input-inline">
                                <input type="text" name="adminName" placeholder="账号名称模糊搜索" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">登录IP</label>
                            <div class="layui-input-inline">
                                <input type="text" name="ip" placeholder="IP模糊搜索" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">登录源头</label>
                            <div class="layui-input-inline">
                                <select name="loginSrcType">
                                    <option value="">全部</option>
                                    <option value="1">PC</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline">
                            <label class="layui-form-label">登录时间</label>
                            <div class="layui-input-inline" style="width: 180px;">
                                <input type="text" name="startDate" id="startDate" placeholder="开始日期" autocomplete="off" class="layui-input">
                            </div>
                            <div class="layui-form-mid">至</div>
                            <div class="layui-input-inline" style="width: 180px;">
                                <input type="text" name="endDate" id="endDate" placeholder="结束日期" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <button type="submit" class="layui-btn layui-btn-primary" lay-submit lay-filter="data-search-btn"><i class="layui-icon">&#xe615;</i> 搜 索</button>
                            <button type="reset" class="layui-btn layui-btn-primary" id="data-reset-btn"> 重 置</button>
                        </div>
                    </div>
                </form>
            </div>
        </fieldset>

        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <span th:each="tb : ${toolbarButtons}" th:utext="${tb}"></span>
            </div>
        </script>

        <table class="layui-hide" id="adminLoginHistoryTable" lay-filter="adminLoginHistoryTableFilter"></table>

        <script type="text/html" id="adminLoginHistoryTableBar">
            <span th:each="btn : ${rowButtons}" th:utext="${btn}"></span>
        </script>

        <script type="text/html" id="loginSrcTypeTpl">
            {{# if(d.loginSrcType == 1){ }}
            PC
            {{# } else { }}
            其他
            {{# } }}
        </script>

    </div>
</div>
<script th:src="@{/lib/layui-v2.5.5/layui.js}" charset="utf-8"></script>
<script>
    layui.use(['form', 'table', 'laydate'], function () {
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table,
            laydate = layui.laydate;

        //日期范围
        laydate.render({
            elem: '#startDate',
            type: 'datetime',
            format: 'yyyy-MM-dd HH:mm:ss'
        });
        laydate.render({
            elem: '#endDate',
            type: 'datetime',
            format: 'yyyy-MM-dd HH:mm:ss'
        });

        $.fn.serializeJson=function(){
            var serializeObj={};
            var array=this.serializeArray();
            var str=this.serialize();
            $(array).each(function(){
                if(serializeObj[this.name]){
                    if($.isArray(serializeObj[this.name])){
                        serializeObj[this.name].push(this.value);
                    }else{
                        serializeObj[this.name]=[serializeObj[this.name],this.value];
                    }
                }else{
                    serializeObj[this.name]=this.value;
                }
            });
            return serializeObj;
        };

        function getFormParam()
        {
            var formParam = $("#searchForm").serializeJson();
            return formParam;
        }

        $("#data-reset-btn").click(function(){
            $("#searchForm")[0].reset();
            layui.form.render();
        });

        table.render({
            elem: '#adminLoginHistoryTable',
            url: "[[@{/}]]adminLoginHistory/list",
            method:'POST',
            where:getFormParam(),
            toolbar: '#toolbarDemo',
            defaultToolbar: ['filter', {
                title: '提示',
                layEvent: 'LAYTABLE_TIPS',
                icon: 'layui-icon-tips'
            }],
            done:function(res, curr, count)
            {
            },
            cols: [
                [
                {field: 'id', width: 180, title: '主键'},
                {field: 'adminName', width: 150, title: '所属账号'},
                {field: 'adminId', width: 180, title: '账号ID'},
                {field: 'appCode', width: 150, title: '所属应用'},
                {field: 'ip', width: 160, title: '登录IP'},
                {field: 'loginSrcType', width: 120, title: '登录源头', templet: '#loginSrcTypeTpl'},
                {field: 'createDate', width: 180, title: '登录时间'},
                {title: '操作', minWidth: 150, toolbar: '#adminLoginHistoryTableBar', align: "center"}
            ]
            ],
            limits: [15,30,100,200],
            limit: 15,
            page: true,
            skin: 'line'
        });

        // 监听搜索操作
        form.on('submit(data-search-btn)', function (data) {
            //执行搜索重载
            table.reload('adminLoginHistoryTable', {
                page: {
                    curr: 1
                }
                , where: data.field
            }, 'data');

            return false;
        });

        /**
         * toolbar监听事件
         */
        table.on('toolbar(adminLoginHistoryTableFilter)', function (obj) {
        });

        //监听表格复选框选择
        table.on('checkbox(adminLoginHistoryTableFilter)', function (obj) {
            console.log(obj)
        });

        table.on('tool(adminLoginHistoryTableFilter)', function (obj) {
            var data = obj.data;
            if (obj.event === 'show') {
                var index = layer.open({
                    title: '查看登录记录',
                    type: 2,
                    shade: 0.2,
                    maxmin:true,
                    area: ['100%', '100%'],
                    content: '[[@{/}]]adminLoginHistory/showPage/'+data.id
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
                return false;
            }
        });

    });
</script>

</body>
</html>
