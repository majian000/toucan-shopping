<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>商城后台</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" th:href="@{/lib/layui-v2.9.13/src/css/layui.css}" media="all">
    <link rel="stylesheet" th:href="@{/css/public.css}" media="all">
</head>
<body>

<span th:replace="~{common_page::common}"></span>

<div class="layuimini-container">
    <div class="layuimini-main">

        <fieldset class="table-search-fieldset">
            <legend>搜索信息</legend>
            <div style="margin: 10px 10px 10px 10px">
                <form class="layui-form layui-form-pane" id="searchForm" action="">
                    <div class="layui-form-item">
                        <div class="layui-inline">
                            <label class="layui-form-label">接口URL</label>
                            <div class="layui-input-inline" style="width: 300px;">
                                <input type="text" id="apiUrl" name="apiUrl" autocomplete="off" class="layui-input" th:value="${param.apiUrl}">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">应用</label>
                            <div class="layui-input-inline">
                                <input type="text" id="appName" name="appName" autocomplete="off" class="layui-input" th:value="${param.appName}">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">开始时间</label>
                            <div class="layui-input-inline">
                                <input type="text" id="startTime" name="startTime" placeholder="yyyy-MM-dd HH:mm:ss" class="layui-input" readonly>
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">结束时间</label>
                            <div class="layui-input-inline">
                                <input type="text" id="endTime" name="endTime" placeholder="yyyy-MM-dd HH:mm:ss" class="layui-input" readonly>
                            </div>
                        </div>
                        <div class="layui-inline">
                            <button type="submit" class="layui-btn layui-btn-primary" lay-submit lay-filter="data-search-btn"><i class="layui-icon">&#xe615;</i> 查询</button>
                            <button type="reset" class="layui-btn layui-btn-primary" id="data-reset-btn">重置</button>
                        </div>
                    </div>
                </form>
            </div>
        </fieldset>

        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <span th:each="tb : ${toolbarButtons}" th:utext="${tb}"></span>
            </div>
        </script>

        <table class="layui-hide" id="trendTable" lay-filter="trendTable"></table>

        <script type="text/html" id="trendTableBar">
            <span th:each="btn : ${rowButtons}" th:utext="${btn}"></span>
        </script>

    </div>
</div>
<script th:src="@{/lib/layui-v2.9.13/src/layui.js}" charset="utf-8"></script>
<script th:src="@{/lib/jquery-3.4.1/jquery-3.4.1.min.js}" charset="utf-8"></script>
<script>
    layui.use(['form', 'table', 'laydate'], function () {
        var laydate = layui.laydate;
        laydate.render({ elem: '#startTime', type: 'datetime', format: 'yyyy-MM-dd HH:mm:ss', value: new Date(Date.now() - 60*60*1000) });
        laydate.render({ elem: '#endTime',   type: 'datetime', format: 'yyyy-MM-dd HH:mm:ss', value: new Date() });
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table;

        $.fn.serializeJson=function(){
            var serializeObj={};
            var array=this.serializeArray();
            $(array).each(function(){
                if(serializeObj[this.name]){
                    if($.isArray(serializeObj[this.name])){
                        serializeObj[this.name].push(this.value);
                    }else{
                        serializeObj[this.name]=[serializeObj[this.name],this.value];
                    }
                }else{
                    serializeObj[this.name]=this.value;
                }
            });
            return serializeObj;
        };

        table.render({
            elem: '#trendTable',
            url: "[[@{/}]]apiMonitor/trend",
            method: 'GET',
            where: {
                apiUrl: $('#apiUrl').val() || '',
                appName: $('#appName').val() || ''
            },
            toolbar: '#toolbarDemo',
            defaultToolbar: ['filter', {
                title: '提示',
                layEvent: 'LAYTABLE_TIPS',
                icon: 'layui-icon-tips'
            }],
            parseData: function(res) {
                if (res.code === 1 && res.data) {
                    var items = res.data.list || [];
                    var total = res.data.total || 0;
                    return { code: 0, data: items, count: total };
                }
                return { code: res.code || 1, data: [], count: 0, msg: res.msg || '请求失败' };
            },
            cols: [
                [
                    {field: 'timeWindow', title: '时间窗口', width: 180},
                    {field: 'requestCount', title: '请求数', width: 120, sort: true},
                    {field: 'avgMs', title: '平均耗时(ms)', width: 150, sort: true},
                    {field: 'maxMs', title: '最大耗时(ms)', width: 150, sort: true,
                        templet: function(d) {
                            if (d.maxMs > 3000) {
                                return '<span style="color:red;font-weight:bold">' + d.maxMs + '</span>';
                            }
                            return d.maxMs;
                        }},
                    {field: 'minMs', title: '最小耗时(ms)', width: 150}
                ]
            ],
            page: true,
            limits: [15, 30, 50, 100],
            limit: 30,
            skin: 'line'
        });

        // 监听搜索操作
        form.on('submit(data-search-btn)', function (data) {
            var apiUrl = data.field.apiUrl;
            var appName = data.field.appName;
            if (!apiUrl) {
                layer.msg('请输入接口URL');
                return false;
            }
            table.reload('trendTable', {
                page: { curr: 1 },
                where: {
                    apiUrl: data.field.apiUrl || '',
                    appName: data.field.appName || '',
                    startTime: data.field.startTime || '',
                    endTime: data.field.endTime || ''
                }
            }, 'data');
            return false;
        });

        // 监听重置操作
        $('#data-reset-btn').click(function() {
            $('#searchForm')[0].reset();
            form.render();
        });

        // 监听表格toolbar事件
        table.on('toolbar(trendTable)', function (obj) {
            if (obj.event === 'add') {
                // 预留
            } else if (obj.event === 'deleteToolbar') {
                // 预留
            }
        });

        // 监听行工具事件
        table.on('tool(trendTable)', function (obj) {
            // 预留
        });
    });
</script>

</body>
</html>
