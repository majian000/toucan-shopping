<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>接口监控-慢请求列表</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" th:href="@{/lib/layui-v2.9.13/src/css/layui.css}" media="all">
    <link rel="stylesheet" th:href="@{/css/public.css}" media="all">
</head>
<body>
<div class="layuimini-container">
    <div class="layuimini-main">
        <fieldset class="table-search-fieldset">
            <legend>慢请求列表</legend>
            <div style="margin: 10px">
                <div class="layui-inline">
                    <label class="layui-form-label">最低耗时(ms)</label>
                    <div class="layui-input-inline">
                        <select id="minElapsed">
                            <option value="3000" selected>3000ms</option>
                            <option value="5000">5000ms</option>
                            <option value="10000">10000ms</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <button class="layui-btn layui-btn-primary" id="queryBtn"><i class="layui-icon">&#xe615;</i> 查询</button>
                    <button class="layui-btn layui-btn-primary" id="autoRefreshBtn">自动刷新: 关闭</button>
                </div>
            </div>
        </fieldset>

        <table id="slowTable" lay-filter="slowTable"></table>
    </div>
</div>

<script th:src="@{/lib/layui-v2.9.13/src/layui.js}" charset="utf-8"></script>
<script>
    layui.use(['table'], function() {
        var table = layui.table;
        var autoRefreshTimer = null;

        function loadData() {
            var minElapsed = document.getElementById('minElapsed').value;
            table.render({
                elem: '#slowTable',
                url: '[[@{/}]]apiMonitor/slowList?minElapsed=' + minElapsed + '&page=1&size=50',
                method: 'GET',
                parseData: function(res) {
                    if (res.code === 0 && res.data) {
                        return { code: 0, data: res.data };
                    }
                    return { code: res.code, data: [] };
                },
                cols: [[
                    {field: 'apiUrl', title: '接口URL', width: 280},
                    {field: 'httpMethod', title: '方法', width: 80},
                    {field: 'appName', title: '应用', width: 150},
                    {field: 'elapsedMs', title: '耗时(ms)', width: 120, sort: true,
                        templet: function(d) {
                            return '<span style="color:red;font-weight:bold">' + d.elapsedMs + '</span>';
                        }},
                    {field: 'statusCode', title: '状态码', width: 80},
                    {field: 'traceId', title: 'TraceId', width: 120,
                        templet: function(d) {
                            return d.traceId ? '<code style="background:#f0f0f0;padding:2px 6px">' + d.traceId + '</code>' : '-';
                        }},
                    {field: 'serverIp', title: '服务器IP', width: 130},
                    {field: 'requestTime', title: '请求时间', width: 180}
                ]],
                page: true,
                limit: 50,
                skin: 'line'
            });
        }
        document.getElementById('queryBtn').onclick = loadData;
        loadData();

        var autoRefresh = false;
        document.getElementById('autoRefreshBtn').onclick = function() {
            autoRefresh = !autoRefresh;
            this.innerHTML = '自动刷新: ' + (autoRefresh ? '开启(15s)' : '关闭');
            if (autoRefresh) {
                autoRefreshTimer = setInterval(loadData, 15000);
            } else {
                clearInterval(autoRefreshTimer);
            }
        };
    });
</script>
</body>
</html>
