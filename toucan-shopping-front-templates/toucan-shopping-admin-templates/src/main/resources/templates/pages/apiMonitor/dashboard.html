<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>商城后台</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" th:href="@{/lib/layui-v2.9.13/src/css/layui.css}" media="all">
    <link rel="stylesheet" th:href="@{/css/public.css}" media="all">
</head>
<body>

<span th:replace="~{common_page::common}"></span>

<div class="layuimini-container">
    <div class="layuimini-main">

        <fieldset class="table-search-fieldset">
            <legend>搜索信息</legend>
            <div style="margin: 10px 10px 10px 10px">
                <form class="layui-form layui-form-pane" id="searchForm" action="">
                    <div class="layui-form-item">
                        <div class="layui-inline">
                            <label class="layui-form-label">时间范围</label>
                            <div class="layui-input-inline">
                                <select id="minutesSelect" name="minutes" lay-search="">
                                    <option value="1">最近1分钟</option>
                                    <option value="5" selected>最近5分钟</option>
                                    <option value="15">最近15分钟</option>
                                    <option value="30">最近30分钟</option>
                                    <option value="60">最近60分钟</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline">
                            <button type="submit" class="layui-btn layui-btn-primary" lay-submit lay-filter="data-search-btn"><i class="layui-icon">&#xe669;</i> 刷新</button>
                        </div>
                    </div>
                </form>
            </div>
        </fieldset>

        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <span th:each="tb : ${toolbarButtons}" th:utext="${tb}"></span>
            </div>
        </script>

        <table class="layui-hide" id="dashboardTable" lay-filter="dashboardTable"></table>

        <script type="text/html" id="dashboardTableBar">
            <span th:each="btn : ${rowButtons}" th:utext="${btn}"></span>
        </script>

    </div>
</div>
<script th:src="@{/lib/layui-v2.9.13/src/layui.js}" charset="utf-8"></script>
<script th:src="@{/lib/jquery-3.4.1/jquery-3.4.1.min.js}" charset="utf-8"></script>
<script>
    layui.use(['form', 'table'], function () {
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table;
        var autoRefreshTimer = null;

        $.fn.serializeJson=function(){
            var serializeObj={};
            var array=this.serializeArray();
            $(array).each(function(){
                if(serializeObj[this.name]){
                    if($.isArray(serializeObj[this.name])){
                        serializeObj[this.name].push(this.value);
                    }else{
                        serializeObj[this.name]=[serializeObj[this.name],this.value];
                    }
                }else{
                    serializeObj[this.name]=this.value;
                }
            });
            return serializeObj;
        };

        table.render({
            elem: '#dashboardTable',
            url: "[[@{/}]]apiMonitor/summary",
            method: 'GET',
            where: { minutes: '5' },
            toolbar: '#toolbarDemo',
            defaultToolbar: ['filter', {
                title: '提示',
                layEvent: 'LAYTABLE_TIPS',
                icon: 'layui-icon-tips'
            }],
            parseData: function(res) {
                if (res.code === 1 && res.data) {
                    var items = res.data.items || [];
                    return { code: 0, data: items, count: items.length };
                }
                return { code: res.code || 1, data: [], count: 0, msg: res.msg || '请求失败' };
            },
            cols: [
                [
                    {field: 'apiUrl', title: '接口URL', minWidth: 300},
                    {field: 'appName', title: '应用', width: 180},
                    {field: 'requestCount', title: '请求数(QPS)', width: 120, sort: true},
                    {field: 'avgMs', title: '平均耗时(ms)', width: 140, sort: true},
                    {field: 'maxMs', title: '最大耗时(ms)', width: 140, sort: true,
                        templet: function(d) {
                            if (d.maxMs > 1000) {
                                return '<span style="color:red;font-weight:bold">' + d.maxMs + '</span>';
                            }
                            return d.maxMs;
                        }},
                    {field: 'minMs', title: '最小耗时(ms)', width: 140},
                    {title: '操作', width: 100, align: 'center'}
                ]
            ],
            page: false,
            skin: 'line'
        });

        // 监听搜索操作
        form.on('submit(data-search-btn)', function (data) {
            table.reload('dashboardTable', {
                page: { curr: 1 },
                where: data.field
            }, 'data');
            return false;
        });

        // 自动刷新
        var autoRefresh = false;

        // 监听表格toolbar事件
        table.on('toolbar(dashboardTable)', function (obj) {
            if (obj.event === 'add') {
                // 预留
            } else if (obj.event === 'deleteToolbar') {
                // 预留
            }
        });

        // 监听行工具事件
        table.on('tool(dashboardTable)', function (obj) {
            var data = obj.data;
            if (obj.event === 'trend') {
                var index = layer.open({
                    title: '接口趋势 - ' + data.apiUrl,
                    type: 2,
                    shade: 0.2,
                    maxmin: true,
                    area: ['100%', '100%'],
                    content: '[[@{/}]]apiMonitor/trendPage?apiUrl='
                        + encodeURIComponent(data.apiUrl) + '&appName=' + (data.appName || '')
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
            }
        });
    });
</script>

</body>
</html>
