<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>商城后台</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" th:href="@{/lib/layui-v2.5.5/css/layui.css}" media="all">
    <link rel="stylesheet" th:href="@{/css/public.css}" media="all">

</head>
<body>

<span th:replace="common_page::common"></span>


<div class="layuimini-container">
    <div class="layuimini-main" style="min-height: 800px;">

        <input type="hidden" id="orderNo" name="orderNo" th:value="${orderNo}">

        <table class="layui-hide" id="orderLogTable" lay-filter="orderLogTableFilter"></table>
    </div>
</div>







<script th:src="@{/lib/layui-v2.5.5/layui.js}" charset="utf-8"></script>
<script th:src="@{/lib/jquery-3.4.1/jquery-3.4.1.min.js}" charset="utf-8"></script>
<script>

    var selectSpu={spuName:"",spuId:-1,spuUuid:""};


    layui.config({
        base: basePath+'/lib/layui_ext/dtree/' //配置 layui 第三方扩展组件存放的基础目录
    }).extend({
        dtree: 'dtree' //定义该组件模块名
    }).use(['form', 'table','tree','dtree','jquery','laydate'], function () {
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table;
        var index;
        var tree = layui.tree;
        var loadding;
        var loaddingTree;
        var dtree = layui.dtree;
        var laydate = layui.laydate;

        $.fn.serializeJson=function(){
            var serializeObj={};
            var array=this.serializeArray();
            var str=this.serialize();
            $(array).each(function(){
                if(serializeObj[this.name]){
                    if($.isArray(serializeObj[this.name])){
                        serializeObj[this.name].push(this.value);
                    }else{
                        serializeObj[this.name]=[serializeObj[this.name],this.value];
                    }
                }else{
                    serializeObj[this.name]=this.value;
                }
            });
            return serializeObj;
        };


        table.render({
            elem: '#orderLogTable',
            url: "[[@{/}]]order/orderLog/list",
            method:'POST',
            where:{"orderNo":$("#orderNo").val()},
            defaultToolbar: ['filter',  {
                title: '提示',
                layEvent: 'LAYTABLE_TIPS',
                icon: 'layui-icon-tips'
            }],
            done:function(res, curr, count)
            {
            },
            cols: [
                [
                    {field: 'orderNo',  title: '订单编号', width: 260},
                    {field: 'batchId',  title: '操作批次ID', width: 200},
                    {field: 'operateUserId',  title: '操作人ID', width: 200},
                    {field: 'operateUserName',  title: '操作人', width: 100},
                    {field: 'operateUserType', width: 100, title: '操作人类型',
                        templet: function (row) {
                            if(row.operateUserType == "1"){
                                return "管理员"
                            }else if(row.operateUserType == "2"){
                                return "普通用户"
                            }
                            return row.operateUserType;
                        }},
                    {field: 'createDate',  title: '创建时间', width: 200},
                    {field: 'dataBody',  title: '变更数据', width: 200},
                    {field: 'remark',  title: '操作备注', width: 200},
                    {field: 'typeName', width: 150, title: '操作类型'}
                ]
            ],
            limits: [15,30,100,200],
            limit: 15,
            page: true,
            skin: 'line'
        });



        //监听表格复选框选择
        table.on('checkbox(orderLogTableFilter)', function (obj) {
            // console.log(obj)
        });

        table.on('tool(orderLogTableFilter)', function (obj) {
            var data = obj.data;
        });


    });
</script>

</body>
</html>
