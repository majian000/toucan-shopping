<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>登录历史详情</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" th:href="@{/lib/layui-v2.5.5/css/layui.css}" media="all">
    <link rel="stylesheet" th:href="@{/css/public.css}" media="all">
    <style>
        body {
            background-color: #ffffff;
        }
    </style>
</head>
<body>
<div class="layui-form layuimini-form">
    <div class="layui-form-item">
        <label class="layui-form-label required">主键</label>
        <div class="layui-input-block">
            <input type="text" readonly class="layui-input" th:value="${model.id}">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label required">账号ID</label>
        <div class="layui-input-block">
            <input type="text" readonly class="layui-input" th:value="${model.adminId}">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label required">所属应用</label>
        <div class="layui-input-block">
            <input type="text" readonly class="layui-input" th:value="${model.appCode}">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label required">登录IP</label>
        <div class="layui-input-block">
            <input type="text" readonly class="layui-input" th:value="${model.ip}">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label required">登录源头</label>
        <div class="layui-input-block">
            <input type="text" readonly class="layui-input" th:value="${model.loginSrcType == 1 ? 'PC' : '其他'}">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label required">登录时间</label>
        <div class="layui-input-block">
            <input type="text" readonly class="layui-input" th:value="${#dates.format(model.createDate,'yyyy-MM-dd HH:mm:ss')}">
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-input-block">
            <button class="layui-btn layui-btn-primary" id="closeBtn">关闭</button>
        </div>
    </div>
</div>
<script th:src="@{/lib/layui-v2.5.5/layui.js}" charset="utf-8"></script>
<script>
    layui.use(['form'], function () {
        var form = layui.form,
            layer = layui.layer,
            $ = layui.$;

        //监听提交
        form.on('submit(saveBtn)', function (data) {
            return false;
        });

        //关闭按钮
        $('#closeBtn').on('click', function () {
            var index = parent.layer.getFrameIndex(window.name);
            parent.layer.close(index);
        });

    });
</script>
</body>
</html>
