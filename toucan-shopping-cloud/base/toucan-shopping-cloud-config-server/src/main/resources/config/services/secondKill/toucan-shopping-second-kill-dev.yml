#========================秒杀服务 开发环境====================================

server:
  port: 8085
spring:
  application:
    name: toucan-shopping-second-kill #应用名称
  zipkin: #链路追踪
    enabled: false
    base-url: http://localhost:9411
    sleuth:
      sampler:
        #采样率 1全部采集
        probability: 1
  mvc: #启动初始化servletdispatcher
    servlet:
      load-on-startup: 100
  cloud:
    loadbalancer:
      retry:
        enabled: true
        retry-on-all-operations: true
        max-retries-on-next-service-instance: 2
        max-retries-on-same-service-instance: 0
      cache:
        ttl: 3s
    nacos:
      discovery:
        server-addr: ${toucan.nacos.ip}:${toucan.nacos.port}
        ip: ${toucan.ip}    #使用IP地址注册
        port: ${server.port}
        username: ${toucan.nacos.username}
        password: ${toucan.nacos.password}
        metadata:
          preserved.heart.beat.interval: 4000 #心跳间隔(毫秒)
          preserved.heart.beat.timeout: 4500 #心跳超时(毫秒)
    openfeign:
      circuitbreaker:
        enabled: true

feign:

  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
        cancelRunningFuture: true
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 8
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

toucan:
  app-code: 10001001 #自定义应用编码
  admin-auth:
    enabled: false
    name: toucan-shopping-admin-auth
  modules:
    skylarkLock:
      type: redis
      redis:
        select: single
        timeout: 10000
        password: mj_tocan_redis_7612
        host: 8.140.187.184
        port: 6379
        database: 0
        maxActive: 50
        maxWaitMillis: 15
        maxIdle: 50
        minIdle: 0



management:
  health:
    elasticsearch:
      enabled: false
    redis:
      enabled: false