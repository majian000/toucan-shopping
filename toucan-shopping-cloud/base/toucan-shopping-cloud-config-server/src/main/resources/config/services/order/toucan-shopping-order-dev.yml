#========================订单服务 开发环境====================================

server:
  port: 8084
  #最小空闲线程
  min-spare-threads: 100
  #最大线程数
  max-threads: 500
  #最大链接数
  max-connections: 500
  #最大等待队列长度
  accept-count: 200
spring:
  application:
    name: toucan-shopping-order #应用名称
  zipkin: #链路追踪
    enabled: false
    base-url: http://localhost:9411
    sleuth:
      sampler:
        #采样率 1全部采集
        probability: 1
  mvc: #启动初始化servletdispatcher
    servlet:
      load-on-startup: 100
  cloud:
    nacos:
      discovery:
        ip: ${toucan.ip}    #使用IP地址注册
        port: ${server.port}
        server-addr: ${toucan.nacos.ip}:${toucan.nacos.port}
        username: ${toucan.nacos.username}
        password: ${toucan.nacos.password}
        metadata:
          preserved.heart.beat.interval: 4000 #心跳间隔(毫秒)
          preserved.heart.beat.timeout: 4500 #心跳超时(毫秒)
    openfeign:
      circuitbreaker:
        enabled: true

#eureka:
