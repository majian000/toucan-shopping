feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
        cancelRunningFuture: true
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 8
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  thread-pool-bulkhead:
    configs:
      default:
        max-thread-pool-size: 50
        core-thread-pool-size: 20
        queue-capacity: 500



toucan:
  machine-id: 2201 #机器编码
  app-code: 10001002 #用户中心 应用编码
  #雪花算法ID相关
  # workerId: 0 #工作ID 0~31, 每个服务实例都有一个工作ID
  # datacenterId: 0 #数据中心ID (0~31)
  plugins:
    traceId:
      enabled: true
    apiMonitor:
      enabled: true
      scanPackages:
        - com.toucan.shopping.cloud
      excludePatterns:
        - /actuator/**
        - /error

management:
  health:
    elasticsearch:
      enabled: false
    redis:
      enabled: false