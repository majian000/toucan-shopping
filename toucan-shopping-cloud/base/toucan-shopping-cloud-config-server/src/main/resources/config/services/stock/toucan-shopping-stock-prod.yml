#========================库存服务 开发环境====================================

server:
  port: ${toucan.port}
spring:
  application:
    name: toucan-shopping-stock #应用名称
  zipkin: #链路追踪
    enabled: false
    base-url: http://localhost:9411
    sleuth:
      sampler:
        #采样率 1全部采集
        probability: 1
  mvc: #启动初始化servletdispatcher
    servlet:
      load-on-startup: 100
  cloud:
    nacos:
      discovery:
        ip: ${toucan.ip}    #使用IP地址注册
        port: ${toucan.port}
        server-addr: ${toucan.nacos.ip}:${toucan.nacos.port}
        username: ${toucan.nacos.username}
        password: ${toucan.nacos.password}
        metadata:
          preserved.heart.beat.interval: 4000 #心跳间隔(毫秒)
          preserved.heart.beat.timeout: 4500 #心跳超时(毫秒)

#eureka:
#  instance:
#    lease-expiration-duration-in-seconds: 10 #10秒没发心跳将剔除
#    lease-renewal-interval-in-seconds: 3 #心跳3秒
#    prefer-ip-address: true
#    instance-id: ${toucan.ip}:${toucan.port}    #使用IP地址注册
#  client:
#    registryFetchIntervalSeconds: 3 #3秒更新本地服务列表
#    serviceUrl:
#      defaultZone: http://${toucan.eureka.ip}:${toucan.eureka.port}/eureka

toucan:
  machine-id: 2202 #机器编码
  #雪花算法ID相关
  # workerId: 1 #工作ID 0~31, 每个服务实例都有一个工作ID
  # datacenterId: 0 #数据中心ID (0~31)
  modules:
  plugins:
    traceId:
      enabled: true
    apiMonitor:
      enabled: true
      scanPackages:
        - com.toucan.shopping.cloud
      excludePatterns:
        - /actuator/**
        - /error

management:
  health:
    elasticsearch:
      enabled: false
    redis:
      enabled: false

