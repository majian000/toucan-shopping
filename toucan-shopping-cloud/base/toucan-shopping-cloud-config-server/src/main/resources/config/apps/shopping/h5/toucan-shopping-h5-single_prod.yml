#========================商城H5端 单服务 生产环境====================================

server:
  port: 8093
  servlet:
    encoding:
      charset: utf-8
      force: true
      enabled: true
spring:
  application:
    name: toucan-shopping-h5
  cloud:
    service-registry:
      auto-registration:
        enabled: false
    nacos:
      discovery:
        enabled: false
  mvc:
    servlet:
      load-on-startup: 100
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 15MB
  compression:
    enabled: true
    mime-types: application/javascript,text/css,application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 2048

toucan:
  machine-id: 2201
  app-code: 10001009
  user:
    head-sculpture-max-size: 2048
    default-head-sculpture: group1/M00/00/00/rB5PVWC0wtCAfEp6AAAMz-h0lpc563_big.jpg
  user-auth:
    enabled: true
    name: toucan-shopping-user
    login-salt: 0.4947
    cookie-prefix: h5_
    http-toucan-auth-header: Cookie
    path-patterns: /**
    exclude-path-patterns: /**/*.js,/**/*.css,/**/*.jpg,/**/*.png,/**/*.gif,/**/*.json,/**/*.ico
  plugins:
    xss-filter:
      enabled: true
      exclude-paths:
    traceId:
      enabled: true
    apiMonitor:
      enabled: true
      scanPackages:
        - com.toucan.shopping
      excludePatterns:
        - /actuator/**
        - /error
  modules:
    email:
      enabled: true
      protocol: smtp
      smtp:
        host: smtp.163.com
        auth: true
        port: 465
        socketFactory-class: javax.net.ssl.SSLSocketFactory
        socketFactory-fallback: false
      sender: mmdrss@163.com
      sender-authentication-code: IJHWJFZINFUPQIUC
    userLoginCache:
      cache-type: redis
      redis-type: default
      default-redis:
        select: single
        timeout: 10000
        password: mj_tocan_redis_7612
        host: 8.140.187.184
        port: 6379
        database: 0
        hosts: 8.140.187.184:6379
        maxRedirects: 3
        maxActive: 50
        maxWaitMillis: 15
        maxIdle: 50
        minIdle: 0
    log:
      param:
        ignore-url-patterns[0]: .*\.js
        ignore-url-patterns[1]: .*\.css
        ignore-url-patterns[2]: .*\.jpg
        ignore-url-patterns[3]: .*\.png
        ignore-url-patterns[4]: .*\.gif
        ignore-url-patterns[5]: .*\.json
        request:
          enabled: true
          content-type-list[0]: application/x-www-form-urlencoded
          content-type-list[1]: application/json
          ignore-urls[0]: /h5/user/login/password
        response:
          enabled: true
          content-type-list[0]: application/json
          ignore-urls[0]: /h5/user/login/password
      email:
        enabled: true
        title: ——商城H5端——异常邮件
        ignore-exception-list[0]: javax.mail.MessagingException
        ignore-exception-list[1]: com.toucan.shopping.modules.exception.user.UserHeaderException
        protocol: smtp
        smtp:
          host: smtp.163.com
          auth: true
          port: 465
          socketFactory-class: javax.net.ssl.SSLSocketFactory
          socketFactory-fallback: false
        sender: mmdrss@163.com
        sender-authentication-code: IJHWJFZINFUPQIUC
        receiver-list[0]:
          email: 695391446@qq.com
          name: majian
    toucanRedis: #redis模块
      select: single # 可选值 single:单实例 cluster:集群
      timeout: 10000
      password: mj_tocan_redis_7612 #多个集群要求每个密码统一
      #单实例
      host: 8.140.187.184
      port: 6379
      database: 0
      #集群配置
      hosts: 192.168.80.129:6380,192.168.80.129:6381,192.168.80.129:6382 #多个用,分割
      maxRedirects: 3 #最大连接转移数
      #jedis pool配置
      maxActive: 50 #最大活跃数
      maxWaitMillis: 15 #最大等待数
      maxIdle: 50 #最大核心线程数
      minIdle: 0 #最小核心线程数
    contentCache:
