#========================权限中台定时任务调度 生产环境====================================

server:
  port: 9001
spring:
  application:
    name: toucan-shopping-admin-auth-scheduler #应用名称
  zipkin: #链路追踪
    enabled: false
    base-url: http://localhost:9411
    sleuth:
      sampler:
        #采样率 1全部采集
        probability: 1
  cloud:
    loadbalancer:
      retry:
        enabled: true
        retry-on-all-operations: true
        max-retries-on-next-service-instance: 2
        max-retries-on-same-service-instance: 0
      cache:
        ttl: 3s #开启重试机制
      eager-load:
        clients:
          - toucan-shopping-admin-auth
          - toucan-shopping-gateway
    nacos:
      discovery:
        server-addr: ${toucan.nacos.ip}:${toucan.nacos.port}
        ip: ${toucan.ip}    #使用IP地址注册
        port: ${toucan.port}
        register-enabled: false
        username: ${toucan.nacos.username}
        password: ${toucan.nacos.password}
        metadata:
          preserved.heart.beat.interval: 4000 #心跳间隔(毫秒)
          preserved.heart.beat.timeout: 4500 #心跳超时(毫秒)
    openfeign:
      circuitbreaker:
        enabled: true
#eureka:
#  client:
#    registryFetchIntervalSeconds: 3 #3秒更新本地服务列表
#    registerWithEureka: false
#    serviceUrl:
#      defaultZone: http://${toucan.eureka.ip}:${toucan.eureka.port}/eureka

feign:

  client:
    config:
      default:
        connectTimeout: 30000
        readTimeout: 30000
resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 30s
        cancelRunningFuture: true
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 8
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true






management:
  health:
    elasticsearch:
      enabled: false
    redis:
      enabled: false


toucan:
  machine-id: 2201 #机器编码
  app-code: 10001001 #自定义应用编码
  admin-auth-scheduler:
    loop-es-cache: true #循环查询权限信息缓存到es
    loop-login-cache: true #循环查询登录用户(将超时的key状态改成未登录)
  modules:
    adminAuthCache:
      redis:
        select: single # 可选值 single:单实例 cluster:集群
        timeout: 10000
        password: mj_tocan_redis_7612 #多个集群要求每个密码统一
        #单实例
        host: 8.140.187.184
        port: 6379
        database: 0
        #集群配置
        hosts: 192.168.80.129:6380,192.168.80.129:6381,192.168.80.129:6382 #多个用,分割
        maxRedirects: 3 #最大连接转移数
        #jedis pool配置
        maxActive: 50 #最大活跃数
        maxWaitMillis: 15 #最大等待数
        maxIdle: 50 #最大核心线程数
        minIdle: 0 #最小核心线程数
    log: #日志模块
      param:
        #只配置请求即可,忽略以上请求日志
        ignore-url-patterns[0]: .*\.js
        ignore-url-patterns[1]: .*\.css
        ignore-url-patterns[2]: .*\.jpg
        ignore-url-patterns[3]: .*\.png
        ignore-url-patterns[4]: .*\.gif
        ignore-url-patterns[5]: .*\.json
        request:
          enabled: false
        response:
          enabled: false
      email:
        enabled: true
        title: ——权限中心任务调度——异常邮件
        ignore-exception-list[0]: javax.mail.MessagingException
        protocol: smtp
        smtp: #smtp服务器配置
          host: smtp.163.com #SMTP服务器
          auth: true #SMTP认证
          port: 465
          socketFactory-class: javax.net.ssl.SSLSocketFactory
          socketFactory-fallback: false
        sender: mmdrss@163.com #发件人
        sender-authentication-code: IJHWJFZINFUPQIUC #发件人授权码
        receiver-list[0]:
          email: 695391446@qq.com
          name: majian
