#========================定时任务调度 开发环境====================================

server:
  port: 8092
spring:
  application:
    name: toucan-shopping-scheduler #应用名称
  task:
    execution:
      pool:
        core-size: 5 #核心线程
        max-size: 10 #最大线程
        queue-capacity: 150 #缓冲队列
        keep-alive: 20s #允许空闲时间(秒)
        name-prefix: async-thread-pool
  zipkin: #链路追踪
    enabled: false
    base-url: http://localhost:9411
    sleuth:
      sampler:
        #采样率 1全部采集
        probability: 1
  cloud:
    service-registry:
      auto-registration:
        enabled: false
    nacos:
      discovery:
        enabled: false
#eureka:
#  client:
#    registryFetchIntervalSeconds: 3 #3秒更新本地服务列表
#    registerWithEureka: false
#    serviceUrl:
#      defaultZone: http://localhost:8081/eureka

toucan:
  machine-id: 2201 #机器编码
  app-code: 10001001 #自定义应用编码
  #雪花算法ID相关
  # workerId: 0 #工作ID 0~31, 每个服务实例都有一个工作ID
  # datacenterId: 0 #数据中心ID (0~31)
  modules:
    toucanRedis: #redis模块
      select: single # 可选值 single:单实例 cluster:集群
      timeout: 10000
      password: mj_tocan_redis_7612 #多个集群要求每个密码统一
      #单实例
      host: 8.140.187.184
      port: 6379
      database: 0
      #集群配置
      hosts: 192.168.80.129:6380,192.168.80.129:6381,192.168.80.129:6382 #多个用,分割
      maxRedirects: 3 #最大连接转移数
      #jedis pool配置
      maxActive: 50 #最大活跃数
      maxWaitMillis: 15 #最大等待数
      maxIdle: 50 #最大核心线程数
      minIdle: 0 #最小核心线程数
    categoryCache:
