#========================商城H5端 开发环境====================================

server:
  port: 8093
  servlet:
    encoding:
      charset: utf-8
      force: true
      enabled: true
spring:
  application:
    name: toucan-shopping-h5 #应用名称
  cloud:
    loadbalancer:
      retry:
        enabled: true
        retry-on-all-operations: true
        max-retries-on-next-service-instance: 2
        max-retries-on-same-service-instance: 0
      cache:
        ttl: 3s
      eager-load:
        clients:
          - toucan-shopping-category
          - toucan-shopping-order
          - toucan-shopping-product
          - toucan-shopping-user
          - toucan-shopping-area
          - toucan-shopping-gateway
          - toucan-shopping-stock
    nacos:
      discovery:
        server-addr: ${toucan.nacos.ip}:${toucan.nacos.port}
        ip: ${toucan.ip}
        port: ${server.port}
        register-enabled: false
        fail-fast: false
        username: ${toucan.nacos.username}
        password: ${toucan.nacos.password}
    openfeign:
      circuitbreaker:
        enabled: true
  mvc:
    servlet:
      load-on-startup: 100
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 15MB
  compression:
    enabled: true
    mime-types: application/javascript,text/css,application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 2048

feign:
  client:
    config:
      default:
        connectTimeout: 30000
        readTimeout: 30000
resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 30s
        cancelRunningFuture: true
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 8
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  threadpool:
      coreSize: 80
      maxQueueSize: 1500
      queueSizeRejectionThreshold: 1000
  thread-pool-bulkhead:
    configs:
      default:
        max-thread-pool-size: 50
        core-thread-pool-size: 20
        queue-capacity: 500

toucan:
  machine-id: 2201
  app-code: 10001009 #H5端应用编码
  user:
    head-sculpture-max-size: 2048
    default-head-sculpture: group1/M00/00/00/rB5PVWC0wtCAfEp6AAAMz-h0lpc563_big.jpg
  user-auth:
    enabled: true
    name: toucan-shopping-user
    login-salt: 0.4947 #这个必须要修改成你自己的,要不然会有很严重的安全性问题
    #H5 独立会话：cookie 前缀 h5_，与 PC(tss_)/卖家(tss_) 互不认
    cookie-prefix: h5_
    http-toucan-auth-header: Cookie
    #拦截指定路径
    path-patterns: /**
    #忽略拦截
    exclude-path-patterns: /**/*.js,/**/*.css,/**/*.jpg,/**/*.png,/**/*.gif,/**/*.json,/**/*.ico
  plugins:
    xss-filter:
      enabled: true
      exclude-paths:
    traceId:
      enabled: true
    apiMonitor:
      enabled: true
      scanPackages:
        - com.toucan.shopping
      excludePatterns:
        - /actuator/**
        - /error
  modules:
    email:
      enabled: true
      protocol: smtp
      smtp:
        host: smtp.163.com
        auth: true
        port: 465
        socketFactory-class: javax.net.ssl.SSLSocketFactory
        socketFactory-fallback: false
      sender: mmdrss@163.com
      sender-authentication-code: IJHWJFZINFUPQIUC
    log:
      param:
        ignore-url-patterns[0]: .*\.js
        ignore-url-patterns[1]: .*\.css
        ignore-url-patterns[2]: .*\.jpg
        ignore-url-patterns[3]: .*\.png
        ignore-url-patterns[4]: .*\.gif
        ignore-url-patterns[5]: .*\.json
        request:
          enabled: true
          content-type-list[0]: application/x-www-form-urlencoded
          content-type-list[1]: application/json
          ignore-urls[0]: /h5/user/login/password
        response:
          enabled: true
          content-type-list[0]: application/json
          ignore-urls[0]: /h5/user/login/password
      email:
        enabled: false
        title: ——商城H5端——异常邮件
        ignore-exception-list[0]: javax.mail.MessagingException
        ignore-exception-list[1]: com.toucan.shopping.modules.exception.user.UserHeaderException
        protocol: smtp
        smtp:
          host: smtp.163.com
          auth: true
          port: 465
          socketFactory-class: javax.net.ssl.SSLSocketFactory
          socketFactory-fallback: false
        sender: mmdrss@163.com
        sender-authentication-code: IJHWJFZINFUPQIUC
        receiver-list[0]:
          email: 695391446@qq.com
