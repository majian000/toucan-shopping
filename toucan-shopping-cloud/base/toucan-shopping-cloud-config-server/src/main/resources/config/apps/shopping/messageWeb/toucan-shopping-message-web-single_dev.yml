#========================消息Web端 开发环境====================================

server:
  port: 8102
spring:
  application:
    name: toucan-shopping-message-web #应用名称
  task:
    execution:
      pool:
        core-size: 5 #核心线程
        max-size: 10 #最大线程
        queue-capacity: 150 #缓冲队列
        keep-alive: 20s #允许空闲时间(秒)
        name-prefix: async-thread-pool
  zipkin: #链路追踪
    enabled: false
    base-url: http://localhost:9411
    sleuth:
      sampler:
        #采样率 1全部采集
        probability: 1
  mvc: #启动初始化servletdispatcher
    view:
      suffix: .html
    servlet:
      load-on-startup: 100
    static-path-pattern: /static/**
  freemarker:
    cache: false
    charset: UTF-8
    suffix: .html
    enabled: true
    content-type: text/html
    template-loader-path: classpath:/templates/
    settings:
      template_exception_handler: com.toucan.shopping.modules.freemarker.exception.PageErrorException
  servlet:
    multipart:
      max-file-size: 5MB  #单个文件最大5MB
      max-request-size: 15MB #单次请求上传文件最大15NB
  compression: #开启gzip压缩
    enabled: true
    mime-types: application/javascript,text/css,application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 2048 #只压缩2MB以上的内容





